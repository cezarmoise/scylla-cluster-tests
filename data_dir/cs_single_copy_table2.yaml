# Single copy backup: one of 10 tables, 1KB rows
keyspace: keyspace1

keyspace_definition: |
  CREATE KEYSPACE IF NOT EXISTS keyspace1 WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 3};

table: table2

table_definition: |
  CREATE TABLE IF NOT EXISTS keyspace1.table2 (
      key blob,
      c0 blob,
      PRIMARY KEY (key)
  ) WITH compaction = {'class': 'IncrementalCompactionStrategy'};

columnspec:
  - name: key
    size: fixed(10)
  - name: c0
    size: fixed(1024)

insert:
  partitions: fixed(1)
  select: fixed(1)/1
  batchtype: UNLOGGED

queries:
  read1:
    cql: SELECT * FROM keyspace1.table2 WHERE key = ?
    fields: samerow
