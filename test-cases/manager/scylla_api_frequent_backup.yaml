test_duration: 1080

instance_type_db: 'i8ge.xlarge'
sizing_loader:
  vcpu: 4
  memory: '>=16'

n_db_nodes: 3
n_loaders: 4

# dataset per rack (1 row = 1Kb, RF=3), override with SCT_MGMT_PREPARE_SNAPSHOT_SIZE
mgmt_prepare_snapshot_size: 500  # GB
mgmt_backup_repaired_percent: 0
user_profile_table_count: 1
mgmt_flush_and_wait_for_compactions: true
# 5 chunks of 100 GB new data, repair and backup after each: 1 TB at the end
mgmt_frequent_backup_cycles: 5
mgmt_frequent_backup_chunk_size: 100

user_prefix: scylla-api-backup-restore

fallback_to_next_region: false
