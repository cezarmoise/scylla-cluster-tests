test_duration: 720

instance_type_db: 'i8ge.xlarge'
sizing_loader:
  vcpu: 4
  memory: '>=16'

n_db_nodes: 3
n_loaders: 3

round_robin: true

# 200GB dataset per rack (1 row = 1Kb, RF=3): first half is written before the repair, second half after it
prepare_write_cmd: ["cassandra-stress write cl=QUORUM n=35791394 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..35791394",
                    "cassandra-stress write cl=QUORUM n=35791394 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=35791395..71582788",
                    "cassandra-stress write cl=QUORUM n=35791394 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=71582789..107374182"]
stress_cmd: ["cassandra-stress write cl=QUORUM n=35791394 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=107374183..143165576",
             "cassandra-stress write cl=QUORUM n=35791394 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=143165577..178956970",
             "cassandra-stress write cl=QUORUM n=35791394 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=178956971..214748364"]

user_prefix: manager-single-copy

# CL=ONE read of the whole dataset, run against each node only, to verify every replica got the restored data
stress_read_cmd: ["cassandra-stress read cl=ONE n=214748364 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)' -mode cql3 native -rate threads=500 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..214748364"]
