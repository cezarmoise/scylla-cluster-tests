test_duration: 720

instance_type_db: 'i8ge.xlarge'
sizing_loader:
  vcpu: 4
  memory: '>=16'

n_db_nodes: 3
# rows per loader must be whole, for both the repaired and the unrepaired part of the dataset
n_loaders: 4

# dataset per rack (1 row = 1Kb, RF=3), c-s cmd from `mgmt_snapshots_preparer_params`, override with SCT_MGMT_PREPARE_SNAPSHOT_SIZE
mgmt_prepare_snapshot_size: 200  # GB

user_prefix: manager-single-copy
