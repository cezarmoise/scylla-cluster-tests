
test_duration: 4700
prepare_write_cmd: [
  "cassandra-stress write no-warmup cl=QUORUM n=200000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=200 -col 'size=FIXED(128) n=FIXED(8)' -pop seq=1..200000000",
]

stress_cmd: [
  "cassandra-stress mixed no-warmup cl=QUORUM duration=4300m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate 'threads=150 fixed=15000/s' -col 'size=FIXED(128) n=FIXED(8)' -pop 'dist=gauss(1..300000000,150000000,15000000)'"
]

n_db_nodes: 3
simulated_racks: 3
instance_type_db: 'i4i.large'

n_loaders: 3
instance_type_loader: 'c6i.2xlarge'
instance_type_monitor: 't3.large'

nemesis_class_name: 'SisyphusMonkey'
nemesis_selector: 'disruptive and not (sla or limited or manager_operation or config_changes)'
nemesis_seed: '007'
nemesis_interval: 30
nemesis_during_prepare: false

user_prefix: 'compaction-controller-test'
round_robin: true
